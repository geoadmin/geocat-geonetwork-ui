<gn-ui-organisations-filter (sortBy)="setSortBy($event)" (filterBy)="setFilterBy($event)">
</gn-ui-organisations-filter>
<div class="mt-6 rounded-lg text-gray-800 p-4 bg-slate-100">
  <gn-ui-organisations-result *ngIf="organisationsTotal$ | async" [hits]="organisationResults$ | async"
    [total]="organisationsTotal$ | async">
  </gn-ui-organisations-result>
</div>
<div *ngIf="groupedOrganizationsPaged$ | async as groupedOrganizations">
  <ng-container *ngFor="let category of (groupedOrganizationsPaged$ | async | keyvalue); trackBy: trackByIndex">
    <gn-ui-expandable-panel [style.min-height]="'500px'" [style.max-height]="'100vh'"
      [title]="category.key + ' (' + ((categoryCounts$ | async)?.[category.key] || 0) + ' organisations)'"
      [collapsed]="collapsedState[category] ?? true">
      <div class="grid grid-cols-1 gap-x-6 gap-y-8 sm:grid-cols-2 lg:grid-cols-3">
        <gn-ui-content-ghost class="h-[300px]" ghostClass="h-full mb-36"
          *ngFor="let organisation of category.value; trackBy: trackByIndex" [showContent]="!!organisation.name">
          <gn-ui-organisation-preview [organization]="organisation" [organisationUrl]="getOrganisationUrl(organisation)"
            (clickedOrganisation)="orgSelect.emit($event)">
          </gn-ui-organisation-preview>
        </gn-ui-content-ghost>
      </div>
      <div class="py-4" *ngIf="(categoryCounts$ | async)?.[category.key] > itemsOnPage">
        <gn-ui-pagination [currentPage]="(categoryCurrentPage$ | async)?.[category.key] || 1"
          [pagesCount]="getCategoryPages(category.key, categoryCounts$ | async)"
          (pageChange)="setCategoryPage(category.key, $event)">
        </gn-ui-pagination>
      </div>
    </gn-ui-expandable-panel>
  </ng-container>
</div>
