<div class="flex flex-col gap-4 w-full">
  <!-- Titre principal (défaut) -->
  <div class="flex flex-row items-start gap-3">
    <textarea
      #titleInput
      cdkTextareaAutosize
      cdkAutosizeMinRows="1"
      data-test="recordTitleInput"
      class="grow font-title text-3xl font-normal overflow-hidden text-black/80"
      [value]="value"
      (change)="onTitleChange($event)"
      [placeholder]="placeholder"
    ></textarea>
    <div class="flex flex-row justify-between self-start mt-0.5 gap-2">
      <span
        class="material-symbols-outlined gn-ui-icon-small m-2 cursor-pointer"
        (click)="focusTitleInput()"
      >
        edit
      </span>
      <button
        *ngIf="otherLanguagesList.length > 0"
        type="button"
        (click)="toggleTranslations()"
        class="text-xs text-gray-500 hover:text-blue-600 px-2 py-1 rounded hover:bg-gray-100 transition-colors whitespace-nowrap font-medium"
        title="Afficher/Masquer les autres langues"
      >
        {{ showTranslations ? '↑ Masquer' : '↓ Traduire' }} ({{ otherLanguagesList.length }})
      </button>
      <button
        *ngIf="otherLanguagesList.length > 0 && !isTranslating"
        type="button"
        (click)="translateWithDeepL()"
        class="text-xs text-purple-600 hover:text-purple-800 px-2 py-1 rounded hover:bg-purple-50 transition-colors whitespace-nowrap font-medium"
        title="Traduire avec DeepL (langues manquantes uniquement)"
      >
        🤖 DeepL
      </button>
      <div
        *ngIf="isTranslating"
        class="flex items-center gap-2 px-2 py-1"
      >
        <mat-spinner diameter="16" class="!m-0"></mat-spinner>
        <span class="text-xs text-gray-500">Traduction...</span>
      </div>
    </div>
  </div>

  <!-- Traductions (masquées par défaut) -->
  <div
    *ngIf="showTranslations && otherLanguagesList.length > 0"
    class="pl-4 pt-2 border-l-2 border-gray-300 space-y-3 animate-in fade-in slide-in-from-top-2"
  >
    <div *ngFor="let lang of otherLanguagesList" class="flex flex-col gap-1">
      <label class="text-sm font-medium text-gray-700">
        <span class="mr-2">{{ lang.label }}</span>
        <span class="text-xs text-gray-400">(optionnel)</span>
      </label>
      <textarea
        cdkTextareaAutosize
        cdkAutosizeMinRows="1"
        class="text-sm p-2 border border-gray-300 rounded bg-gray-50 focus:bg-white focus:border-blue-500 focus:outline-none"
        [value]="getTranslation(lang.code)"
        (change)="onTranslationChange(lang.code, $event)"
        [placeholder]="'Traduction en ' + lang.label"
      ></textarea>
    </div>
  </div>
</div>
